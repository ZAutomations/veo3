<!doctype html>
<html lang="en" data-theme="crimson"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-session" content="__SESSION_TOKEN__"><title>VEO3 Studio</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/theme.css"><script src="/assets/log_view.js" defer></script><script src="/assets/app.js" defer></script></head>
<body>
<aside class="sidebar">
 <a class="brand" href="#home"><span class="brand-mark">V<span>3</span></span><div>VEO3 <b>STUDIO</b><small>YOUR CREATIVE WORKSPACE</small></div></a>
 <div class="nav-label">WORKSPACE</div><nav id="navigation"></nav>
 <div class="sidebar-bottom"><div class="local-card"><span class="status-dot"></span><div>Runs on your computer<small>Your stories stay in your folders</small></div></div><button id="legacy" class="legacy">Open classic interface <span>↗</span></button><div class="sidebar-version">VEO3 Studio · Desktop preview</div></div>
</aside>
<div class="app-shell"><header><div class="breadcrumb">Workspace <span>/</span> <b id="breadcrumb">Overview</b></div><div class="header-right"><select id="theme-picker" class="theme-control" aria-label="Colour theme"><option value="crimson">Crimson</option><option value="ember">Ember</option><option value="matte">Matte</option></select><span id="running-pill" class="pill">No active jobs</span><button class="icon-button" id="refresh" title="Refresh library and accounts" aria-label="Refresh">↻</button><span class="avatar">V3</span></div></header>
<main id="main"></main>
<section id="activity" class="activity"><div class="activity-heading"><div><span class="live-indicator"></span><b>Activity</b><span id="activity-status">Ready when you are</span></div><div class="activity-tools"><select id="job-picker" aria-label="Select job log"><option value="">No jobs yet</option></select><button id="pause-log" class="button small">Pause log</button><button id="copy-log" class="button small">Copy logs</button><button id="stop-job" class="button danger small" disabled>Stop job</button><button id="toggle-log" class="icon-button" title="Expand or collapse activity log" aria-label="Expand activity">⌃</button></div></div><pre id="log" tabindex="0">Your writing and generation logs will appear here.</pre></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm-dialog"><div class="dialog-icon">!</div><h2 id="confirm-title">Confirm action</h2><p id="confirm-text"></p><div class="dialog-actions"><button id="confirm-no" class="button">Cancel</button><button id="confirm-yes" class="button primary">Continue</button></div></dialog>
<dialog id="prompt-dialog"><div class="dialog-top"><div><span class="eyebrow">SCENE PROMPT</span><h2 id="prompt-title"></h2></div><button id="close-prompt" class="icon-button" aria-label="Close prompt">×</button></div><textarea id="prompt-text" readonly aria-label="Scene prompt"></textarea><div class="dialog-actions"><button id="copy-prompt" class="button primary">Copy full prompt</button></div></dialog>
</body></html>
